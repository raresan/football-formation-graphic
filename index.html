<!doctype html>

    <link rel="stylesheet" href="style.css" />

  <body>

        <video class="output__video" muted autoplay>
          <source src="assets/video/BG.mp4" type="video/mp4" />
        </video>

        <div class="output__player">
          <span class="output__player-number" data-player="1"></span>
          <span class="output__player-name" data-player="1"></span>

      </section>

      <section class="pitch">
        <div class="pitch__player">
          <span class="pitch__player-title">Player #1 (Goalkeeper)</span>

          <label class="pitch__player-number">
            Shirt Number
            <input
              type="number"
              min="1"
              max="999"
              class="pitch__player-number-input"
              data-player="1"
            />
          </label>

          <label class="pitch__player-name">
            Name
            <input
              type="text"
              class="pitch__player-name-input"
              data-player="1"
            />
          </label>
        </div>
